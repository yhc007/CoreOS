[package]
name = "robot-brain-am5729"
version = "0.1.0"
edition = "2021"
authors = ["Paul Yu <paul.yu@unomic.com>"]
description = "Robot Brain — pekko-rust on AM5729 Cortex-A15 Linux (Tier 1)"
license = "MIT"

[dependencies]
# ── pekko-rust Actor System ──
pekko-actor = { path = "../../../../pekko-rust/pekko-actor" }
pekko-streams = { path = "../../../../pekko-rust/pekko-streams" }
pekko-persistence = { path = "../../../../pekko-rust/pekko-persistence" }
pekko-remoting = { path = "../../../../pekko-rust/pekko-remoting" }
pekko-event-bus = { path = "../../../../pekko-rust/pekko-event-bus" }
pekko-testkit = { path = "../../../../pekko-rust/pekko-testkit", optional = true }

# ── CoreDB (센서 데이터 저장) ──
# coredb = { path = "../../../../coredb" }

# ── rpmsg IPC (M4 통신) ──
tokio = { version = "1", features = ["full"] }
tokio-serial = "5.4"    # UART fallback
nix = { version = "0.29", features = ["fs", "ioctl"] }  # /dev/rpmsg0 접근

# ── 직렬화 (M4와 공유 프로토콜) ──
postcard = { version = "1.0", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }

# ── 로깅 ──
tracing = "0.1"
tracing-subscriber = "0.3"

# ── 기타 ──
anyhow = "1.0"
bytes = "1.7"

[features]
default = []
testing = ["dep:pekko-testkit"]

[[bin]]
name = "robot-brain"
path = "src/main.rs"
